<!DOCTYPE html>
<html lang="tt" translate="no" class="notranslate">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta name="yandex" content="notranslate">
    <title translate="no" class="notranslate">804 — Зөя Юсыны</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: SFMono-Regular, Consolas, monospace;
            background-color: #ffffff;
            color: #111111;
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            justify-content: space-between; min-height: 100vh;
        }
        header, footer { width: 100%; text-align: center; background-color: #ffffff; }
        header { padding: 50px 20px 20px 20px; }
        footer { padding: 20px 20px 50px 20px; font-size: 14px; font-weight: 600; color: #636e72; }
        .logo { font-size: 42px; font-weight: 800; color: #1a252f; margin-bottom: 20px; }
        main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .canvas-area { display: block; cursor: pointer; position: relative; user-select: none; -webkit-user-select: none; }
        .blueprint-line { fill: none; stroke: #111111; stroke-width: 1.5; }
        .blueprint-thin { fill: none; stroke: #7f8c8d; stroke-width: 1; }
        .axis-line { fill: none; stroke: #b2bec3; stroke-width: 1; }
        .error-label { font-size: 46px; font-weight: bold; fill: #111111; }
        .seo-link { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
        
        .morse-line {
            display: block; width: 100%; height: 2px;
            fill: none; stroke: #b2bec3; stroke-width: 2;
            stroke-dasharray: 14,4,14,4,14,4,3,4,3,14, 14,4,14,4,14,4,14,4,14,12, 3,4,3,4,3,4,3,4,14,28;
        }
    </style>
</head>
<body>

    <header>
         <a href="/" class="logo-link">
            <div class="logo notranslate" lang="tt" translate="no">Зөя Юсыны</div>
        </a>
        <svg class="morse-line"><line x1="0" y1="1" x2="100%" y2="1" /></svg>
    </header>

    <main>
        <a href="/kzn.xml" class="seo-link" rel="sitemap">kzn</a>
        <div class="canvas-area notranslate" translate="no" ondblclick="window.location.href='/kzn.xml';">
            <svg width="360" height="320" viewBox="0 0 360 320">
                <!-- Вертикальная ось КАЗАН разделена на две части, расходящиеся строго из центра (y=130) -->
                <!-- Вверх от центра -->
                <line x1="180" y1="130" x2="180" y2="10" class="axis-line" stroke-dasharray="14,4,3,4,14,12,3,4,14,12,14,4,14,4,3,4,3,12,3,4,14,12,14,4,3,28" />
                <!-- Вниз от центра -->
                <line x1="180" y1="130" x2="180" y2="310" class="axis-line" stroke-dasharray="14,4,3,4,14,12,3,4,14,12,14,4,14,4,3,4,3,12,3,4,14,12,14,4,3,28" />
                
                <!-- Горизонтальная ось ДЭРБИШЛЭР (пересекает вертикаль строго в y=130) -->
                <line x1="20" y1="130" x2="340" y2="130" class="axis-line" stroke-dasharray="14,4,3,4,3,12,3,4,3,4,14,4,3,4,3,12,3,4,14,4,3,12,14,4,3,4,3,4,3,12,3,4,3,12,14,4,14,4,14,4,14,12,3,4,14,4,3,4,3,12,3,4,3,4,14,4,3,4,3,12,3,4,14,4,3,28" />
                
                <path d="M 60 125 A 120 120 0 0 1 300 125" class="blueprint-line" />
                <path d="M 64 125 A 116 116 0 0 1 296 125" class="blueprint-line" stroke-width="1" />
                <circle cx="60" cy="125" r="5" class="blueprint-line" />
                <circle cx="300" cy="125" r="5" class="blueprint-line" />
                <ellipse cx="180" cy="125" rx="120" ry="12" class="blueprint-line" />
                <ellipse cx="180" cy="130" rx="120" ry="12" class="blueprint-line" />
                <path d="M 60 128 A 120 124 0 0 0 300 128" class="blueprint-line" />
                <ellipse cx="180" cy="130" rx="119" ry="11" class="blueprint-thin" stroke-dasharray="4, 4" />
                <path d="M 63 130 A 117 121 0 0 0 297 130" class="blueprint-thin" stroke-dasharray="4, 4" />
                <text x="180" y="200" text-anchor="middle" class="error-label notranslate" translate="no">804</text>
            </svg>
        </div>
    </main>

    <footer>
        <svg class="morse-line" style="margin-bottom: 30px;"><line x1="0" y1="1" x2="100%" y2="1" /></svg>
        <div class="notranslate" translate="no">[ © 2026 | 44434448-4846-4848-4644-464847464446 | CC BY 4.0 ]</div>
    </footer>

</body>
</html>
