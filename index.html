<!DOCTYPE html>
<html lang="tt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta name="yandex" content="notranslate">
    <meta name="description" content="Акрын барган җәяүле тиз барган атлыны узар.">
    <link rel="canonical" href="https://zoyayosyny.ru">
    <title>Зөя Юсыны</title>  
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, Courier, monospace;
            background-color: #ffffff;
            color: #111111;
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            justify-content: space-between; min-height: 100vh;
            user-select: text; -webkit-user-select: text;
        }
        header, footer { 
            width: 100%; 
            height: 110px;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 0 20px;
        }
        footer { 
            font-size: 14px; 
            font-weight: 600; 
            color: #636e72; 
            letter-spacing: 0.3px;
            flex-direction: column;
            gap: 6px;
            text-align: center;
        }
        .logo-link { text-decoration: none; display: inline-block; }
        .logo { font-size: 42px; font-weight: 800; color: #1a252f; margin: 0; line-height: 1; }
        main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; cursor: default; }
        .status-box { width: 100%; max-width: 800px; text-align: center; }
        .status-title { font-size: 32px; font-weight: 700; color: #2c3e50; margin: 0; line-height: 1.3; }
        
        .morse-line {
            position: absolute;
            left: 0;
            width: 100%; 
            height: 2px; 
            fill: none; 
            stroke: #b2bec3; 
            stroke-width: 2;
            stroke-dasharray: 14,4,14,4,14,4,3,4,3,14, 14,4,14,4,14,4,14,4,14,12, 3,4,3,4,3,4,3,4,14,28;
        }
        header .morse-line { bottom: 0; }
        footer .morse-line { top: 0; }
    </style>
</head>
<body>
    <header>
         <a href="/" class="logo-link">
            <h1 class="logo">ТҮ-ТҮ-Ү-Ү</h1>
         </a>
        <svg class="morse-line"><line x1="0" y1="1" x2="100%" y2="1" /></svg>
    </header>
    <main>
        <div class="status-box">
            <p class="status-title">Игътибар, ишекләр ябыла...</p>
        </div>
    </main>
    <footer>
        <svg class="morse-line"><line x1="0" y1="1" x2="100%" y2="1" /></svg>
        
        <div style="word-break: break-all;">44434448-4846-4848-4644-464847464446</div>
        <div>CC BY 4.0</div>

        <div style="display: none;">44434448-4846-4848-4644-464847464446 CC BY 4.0</div>
    </footer>
</body>
</html>
