<!DOCTYPE html>
<html lang="tt" translate="no" class="notranslate">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta name="yandex" content="notranslate">
    <link rel="canonical" href="https://zoyayosyny.ru">
    <title class="notranslate" translate="no">Зөя Юсыны</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, Courier, monospace;
            background-color: #ffffff;
            color: #111111;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
        }
        header, footer {
            width: 100%;
            text-align: center;
            background-color: #ffffff;
        }
        header {
            padding: 50px 20px 20px 20px;
        }
        footer {
            padding: 20px 20px 50px 20px;
            font-size: 14px; 
            font-weight: 600;
            color: #636e72;  
            letter-spacing: 0px;
        }
        .logo-link {
            text-decoration: none;
            display: inline-block;
        }
        .logo {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 0px;
            color: #1a252f;
            margin-bottom: 20px;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 40px 20px 60px 20px;
            background-color: #ffffff;
        }
        .status-box {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        .status-title {
            font-size: 32px;
            font-weight: 700;
            color: #2c3e50;
            margin: 0;
            letter-spacing: 0px;
            line-height: 1.3;
        }
        .morse-line {
            display: block;
            width: 100%;
            height: 2px;
            fill: none;
            stroke: #b2bec3;
            stroke-width: 2;
            stroke-dasharray: 14,4,14,4,14,4,3,4,3,14, 14,4,14,4,14,4,14,4,14,12, 3,4,3,4,3,4,3,4,14,28;
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo-link">
            <div class="logo notranslate" lang="tt" translate="no">Зөя Юсыны</div>
        </a>
        <svg class="morse-line"><line x1="0" y1="1" x2="100%" y2="1" /></svg>
    </header>

    <main>
        <div class="status-box">
            <h1 class="status-title notranslate" lang="tt" translate="no">Монда әле ниләр булыр...</h1>
        </div>
    </main>

    <footer>
        <svg class="morse-line" style="margin-bottom: 30px;"><line x1="0" y1="1" x2="100%" y2="1" /></svg>
        <div class="notranslate" translate="no">[ © 2026 | 44434448-4846-4848-4644-464847464446 | CC BY 4.0 ]</div>
    </footer>

</body>
</html>
