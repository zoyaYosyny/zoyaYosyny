<!DOCTYPE html>
<html lang="tt" translate="no" class="notranslate">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta name="yandex" content="notranslate">
    <link rel="canonical" href="https://zoyayosyny.ru">
    <title class="notranslate" translate="no">Зөя Юсыны</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, Courier, monospace;
            background-color: #ffffff;
            color: #111111;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 50px 20px;
            background-color: #ffffff;
            border-bottom: 2px dashed #b2bec3;
            text-align: center;
        }
        .logo {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 0px;
            color: #1a252f;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 40px 20px 60px 20px;
            background-color: #ffffff;
        }
        .status-box {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        .status-title {
            font-size: 32px;
            font-weight: 700;
            color: #2c3e50;
            margin: 0;
            letter-spacing: 0px;
            line-height: 1.3;
        }
        footer {
            width: 100%;
            padding: 40px 20px;
            font-size: 14px; 
            font-weight: 600;
            color: #636e72;  
            text-align: center;
            background-color: #ffffff;
            border-top: 2px dashed #b2bec3;
            letter-spacing: 0px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo notranslate" lang="tt" translate="no">Зөя Юсыны</div>
    </header>

    <main>
        <div class="status-box">
            <h1 class="status-title notranslate" lang="tt" translate="no">Монда әле ниләр булыр...</h1>
        </div>
    </main>

    <footer>
        <div class="notranslate" translate="no">[ © 2026 | 44434448-4846-4848-4644-464847464446 | CC BY 4.0 ]</div>
    </footer>

</body>
</html>
