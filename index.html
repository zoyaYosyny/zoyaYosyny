<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Zoya Yosyny</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 45px 40px;
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            text-align: center; /* Центрирование логотипа */
        }
        .logo {
            font-size: 36px;
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: -0.5px;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center; /* Центрирование по горизонтали */
            align-items: flex-end;   /* Смещение к нижней части контентной области */
            padding-bottom: 120px;   /* Фиксированный отступ снизу для идеального баланса */
        }
        .status-box {
            text-align: center;

        }
        .status-title {
            font-size: 28px;
            font-weight: 600;
            color: #7f8c8d;
            margin: 0;
            letter-spacing: -0.5px;
        }
        footer {
            width: 100%;
            padding: 25px 40px;
            font-size: 14px; /* Чуть крупнее, чем исходные 12px */
            color: #95a5a6;  /* Немного контрастнее для читаемости */
            text-align: center; /* Текст подвала строго по центру */
            border-top: 1px solid #e2e8f0;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Zoya Yosyny</div>
    </header>

    <main>
        <div class="status-box">
            <h1 class="status-title">В разработке...</h1>
        </div>
    </main>

    <footer>
        <div>© 2026 Zoya Yosyny [44434448-4846-4848-4644-464847464446]. Все права защищены. Лицензия CC BY 4.0.</div>
    </footer>

</body>
</html>
