<!DOCTYPE html>
<html lang="ru" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="google" content="notranslate">
    <meta name="yandex" content="notranslate">
    <link rel="canonical" href="https://zoyayosyny.ru">
    <title>404 — Зөя Йосыны</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            /* Моноширинный шрифт инженерных консолей и чертежных систем */
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, Courier, monospace;
            background-color: #ffffff;
            color: #111111;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 50px 20px;
            background-color: #ffffff;
            border-bottom: 2px dashed #b2bec3; /* Верхний чертежный пунктир */
            text-align: center; /* Логотип строго по центру осевой линии */
        }
        .logo {
            font-size: 42px; /* Плотный масштаб */
            font-weight: 800;
            letter-spacing: 0px; /* Убрали принудительный капс, вернули мягкий регистр */
            color: #1a252f;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center; /* Центрируем фразу по горизонтальной оси */
            align-items: flex-end;   /* Жестко прижимаем фразу к нижней кромке листа */
            padding: 40px 20px 60px 20px; /* Плотный нижний отступ для веса */
            background-color: #ffffff; /* Полностью белый лист чертежа */
        }
        .status-box {
            width: 100%;
            max-width: 800px;
            text-align: center; /* Текст строго по центру осевой линии */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .error-code {
            font-size: 16px;
            font-weight: 700;
            color: #c0392b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-title {
            font-size: 32px; /* Весомый, крупный шаг заголовка */
            font-weight: 700;
            color: #2c3e50;
            margin: 0;
            letter-spacing: 0px;
            line-height: 1.3;
        }
        footer {
            width: 100%;
            padding: 40px 20px; /* Сжали подвал, убрав оверхед */
            font-size: 14px; 
            font-weight: 600;
            color: #636e72;  
            text-align: center; /* Штамп строго по центру */
            background-color: #ffffff;
            border-top: 2px dashed #b2bec3; /* Нижняя рамка листа */
            letter-spacing: 0px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Зөя Юсыны</div>
    </header>

    <main>
        <div class="status-box">
            <div class="error-code notranslate" translate="no">[ CODE: 404 ]</div>
            <h1 class="status-title notranslate" lang="tt" translate="no">Анда да юк, монда да юк...</h1>
        </div>
    </main>

    <footer>
        <div class="notranslate" translate="no">[ © 2026 | 44434448-4846-4848-4644-464847464446 | CC BY 4.0 ]</div>
    </footer>

</body>
</html>
