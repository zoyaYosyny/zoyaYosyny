<!DOCTYPE html>
<html lang="tt" translate="no" class="notranslate">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta name="yandex" content="notranslate">
    <title translate="no" class="notranslate">404 — Зөя Юсыны</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, Courier, monospace;
            background-color: #ffffff;
            color: #111111;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 50px 20px;
            background-color: #ffffff;
            border-bottom: 2px dashed #b2bec3;
            text-align: center;
        }
        .logo {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 0px;
            color: #1a252f;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background-color: #ffffff;
        }
        .canvas-area {
            display: block;
            cursor: pointer;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
        .blueprint-line {
            fill: none;
            stroke: #111111;
            stroke-width: 1.5;
        }
        .blueprint-thin {
            fill: none;
            stroke: #7f8c8d;
            stroke-width: 1;
        }
        .axis-line {
            fill: none;
            stroke: #b2bec3;
            stroke-width: 1;
            stroke-dasharray: 8, 4, 2, 4;
        }
        .dimension-line {
            fill: none;
            stroke: #7f8c8d;
            stroke-width: 1;
            stroke-dasharray: 3, 3;
        }
        .blueprint-text {
            font-family: SFMono-Regular, Consolas, monospace;
            font-size: 11px;
            fill: #7f8c8d;
        }
        .error-label {
            font-family: SFMono-Regular, Consolas, monospace;
            font-size: 46px;
            font-weight: bold;
            fill: #111111;
            letter-spacing: 1px;
        }
        .seo-link {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        footer {
            width: 100%;
            padding: 40px 20px;
            font-size: 14px; 
            font-weight: 600;
            color: #636e72;  
            text-align: center;
            background-color: #ffffff;
            border-top: 2px dashed #b2bec3;
            letter-spacing: 0px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo notranslate" translate="no">Зөя Юсыны</div>
    </header>

    <main>
        <a href="/kzn.xml" class="seo-link" rel="sitemap">kzn</a>

        <div class="canvas-area notranslate" translate="no" ondblclick="window.location.href='/kzn.xml';">
            <svg class="blueprint-svg" width="360" height="320" viewBox="0 0 360 320">
                <line x1="180" y1="10" x2="180" y2="310" class="axis-line" />
                <line x1="20" y1="130" x2="340" y2="130" class="axis-line" />
                
                <path d="M 60 125 A 120 120 0 0 1 300 125" class="blueprint-line" />
                <path d="M 64 125 A 116 116 0 0 1 296 125" class="blueprint-line" stroke-width="1" />
                
                <circle cx="60" cy="125" r="5" class="blueprint-line" />
                <circle cx="300" cy="125" r="5" class="blueprint-line" />
                
                <ellipse cx="180" cy="125" rx="120" ry="12" class="blueprint-line" />
                <ellipse cx="180" cy="130" rx="120" ry="12" class="blueprint-line" />
                
                <path d="M 60 128 A 120 124 0 0 0 300 128" class="blueprint-line" />
                
                <ellipse cx="180" cy="130" rx="119" ry="11" class="blueprint-thin" stroke-dasharray="4, 4" />
                <path d="M 63 130 A 117 121 0 0 0 297 130" class="blueprint-thin" stroke-dasharray="4, 4" />

                <text x="180" y="200" text-anchor="middle" class="error-label notranslate" translate="no">404</text>
            </svg>
        </div>
    </main>

    <footer>
        <div class="notranslate" translate="no">[ © 2026 | 44434448-4846-4848-4644-464847464446 | CC BY 4.0 ]</div>
    </footer>

</body>
</html>
